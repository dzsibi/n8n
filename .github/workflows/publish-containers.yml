name: Publish container images
run-name: Publish container images (${{ inputs.tag }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container image tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  NODE_OPTIONS: --max-old-space-size=7168
  NODE_VERSION: 24.18.1

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid container tag. Use 1-128 letters, digits, periods, underscores, or hyphens; the first character must be a letter, digit, or underscore."
            exit 1
          fi

      - name: Resolve image names
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "n8n=ghcr.io/${OWNER,,}/n8n" >> "$GITHUB_OUTPUT"
          echo "runners=ghcr.io/${OWNER,,}/runners" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build n8n
        run: pnpm build:n8n

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish n8n
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: docker/images/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.images.outputs.n8n }}:${{ inputs.tag }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ inputs.tag }}
            N8N_RELEASE_TYPE=dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}

      - name: Build and publish task runners
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: docker/images/runners/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.images.outputs.runners }}:${{ inputs.tag }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ inputs.tag }}
            N8N_RELEASE_TYPE=dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
